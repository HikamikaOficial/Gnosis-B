[project]
name = "gnosis-agent-ai"
version = "0.0.0"
description = "GNOSIS autonomous multi-agent engineering system"
requires-python = ">=3.12"
dependencies = []

# The ONE canonical operator entry (F-33 Stage 2B.2, ADR-0032 §7). No co-equal
# entry points; any `python -m` shim must delegate to this exact main.
[project.scripts]
gnosis = "gnosis.director.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
  "mypy>=1.14"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnosis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
